<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>SuperMarieddu - Cagliari</title>
<style>
  html,body{margin:0;height:100%;background:#0d0a14;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;line-height:0}
  #game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  #crt{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(0,0,0,.55)}
  #crt.off{display:none}
  body.portrait{align-items:flex-start}
  *{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #touch{position:fixed;inset:0;display:none;pointer-events:none;z-index:5;font:bold 20px monospace}
  #touch.on{display:block}
  #touch .ctl{position:absolute;pointer-events:auto;touch-action:none}
  /* croce direzionale */
  #dpad{left:calc(16px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));width:var(--dp);height:var(--dp);opacity:.82}
  #dpad i{position:absolute;display:block;background:#2a2036;border:3px solid #f8e070;box-shadow:4px 4px 0 rgba(0,0,0,.45)}
  #dpad .h{left:0;right:0;top:33%;bottom:33%}
  #dpad .v{top:0;bottom:0;left:33%;right:33%}
  #dpad .hub{left:calc(33% + 3px);right:calc(33% + 3px);top:33%;bottom:33%;border:0;box-shadow:none}
  #dpad .hub2{left:33%;right:33%;top:calc(33% + 3px);bottom:calc(33% + 3px);border:0;box-shadow:none}
  #dpad b{position:absolute;color:#f8e070;width:33%;height:33%;display:flex;align-items:center;justify-content:center;pointer-events:none}
  #dpad .al{left:0;top:33%}#dpad .ar{right:0;top:33%}#dpad .au{left:33%;top:0}#dpad .ad{left:33%;bottom:0;opacity:.35}
  #dpad.left .al,#dpad.right .ar,#dpad.up .au{color:#1b1424;background:#f8e070}
  /* pulsanti A e B */
  #abtn{right:calc(16px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:calc(var(--bt) * 2.15);height:calc(var(--bt) * 1.6);pointer-events:none}
  #abtn .btn{position:absolute;width:var(--bt);height:var(--bt);border-radius:50%;pointer-events:auto;touch-action:none;
    display:flex;align-items:center;justify-content:center;border:3px solid #1b1424;box-shadow:4px 4px 0 rgba(0,0,0,.45),inset -4px -4px 0 rgba(0,0,0,.25);opacity:.85}
  #abtn .btn::before{content:'';position:absolute;inset:-14px;border-radius:50%}
  #abtn .btn[data-k=jump]{right:0;top:0;background:#d83a2c;color:#fff}
  #abtn .btn[data-k=run]{left:0;bottom:0;background:#f0c040;color:#1b1424}
  #abtn .btn.on{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.45),inset 4px 4px 0 rgba(0,0,0,.25)}
  #abtn small{position:absolute;bottom:-18px;font:bold 10px monospace;color:#c8b07a;width:100%;text-align:center}
  /* tasti piccoli: pausa, musica, schermo intero */
  #tbar{display:flex;gap:6px;pointer-events:auto}
  #tbar button{width:34px;height:30px;padding:0;font:bold 13px monospace;color:#f8e070;background:rgba(27,20,36,.6);border:2px solid #f8e070;border-radius:0;touch-action:none}
  #tbar button.off{color:#777;border-color:#777}
  /* inserimento nome per la classifica */
  #namebox{position:absolute;left:0;right:0;top:calc(var(--s) * 100px);display:none;justify-content:center;gap:calc(var(--s) * 4px);line-height:normal;z-index:6}
  #namebox.on{display:flex}
  #namebox input{width:calc(var(--s) * 84px);font:bold max(16px, calc(var(--s) * 9px)) monospace;text-transform:uppercase;text-align:center;
    color:#f8e070;background:#1b1424;border:2px solid #f0c040;border-radius:0;padding:calc(var(--s) * 2px);outline:none}
  #namebox button{font:bold max(13px, calc(var(--s) * 7px)) monospace;color:#1b1424;background:#f0c040;border:0;border-radius:0;padding:0 calc(var(--s) * 5px)}
  #namebox button.skip{background:#5a4a6a;color:#ddd}
  body.naming #touch{display:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="crt"></div>
  <form id="namebox" autocomplete="off"><input id="nameIn" maxlength="10" spellcheck="false" autocapitalize="characters" enterkeyhint="done" placeholder="NOME"><button type="submit">OK</button><button type="button" class="skip">SALTA</button></form>
</div>
<div id="touch">
  <div id="dpad" class="ctl"><i class="h"></i><i class="v"></i><i class="hub"></i><i class="hub2"></i><b class="al">&lt;</b><b class="ar">&gt;</b><b class="au">^</b><b class="ad">v</b></div>
  <div id="abtn" class="ctl"><div class="btn" data-k="run">B<small>CORRI</small></div><div class="btn" data-k="jump">A<small>SALTA</small></div></div>
  <div id="tbar" class="ctl"><button data-a="pause">II</button><button data-a="music">&#9835;</button><button data-a="fs">[ ]</button></div>
</div>
<script>
(() => {
'use strict';
// ====================================================================
//  COSTANTI / CANVAS
// ====================================================================
const VERSION = '1.4.0';
const VW = 320, VH = 192, T = 16;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap'), crt = document.getElementById('crt');
cv.width = VW; cv.height = VH; ctx.imageSmoothingEnabled = false;

const touchEl = document.getElementById('touch'), dpad = document.getElementById('dpad'), tbar = document.getElementById('tbar');
let touchUI = false;   // true quando si gioca con il touch: mostra il joypad virtuale
function resize() {
  const W = innerWidth, H = innerHeight, portrait = touchUI && H > W * 1.05;
  const ctlH = portrait ? Math.min(280, H * .42) : 0;            // in verticale il joypad sta sotto il gioco
  const availH = H - ctlH;
  const r = Math.min(W / VW, availH / VH);
  const s = r >= 1 && !touchUI ? Math.floor(r) : r;              // su touch si sfrutta tutto lo schermo
  const w = Math.round(VW * s), h = Math.round(VH * s);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px'; wrap.style.setProperty('--s', s);
  document.body.classList.toggle('portrait', portrait);
  const top = portrait ? Math.max(0, Math.round((availH - h) / 2)) : Math.round((H - h) / 2);
  wrap.style.marginTop = portrait ? top + 'px' : '';
  const dp = Math.round(Math.max(100, Math.min(160, Math.min(W, H) * (portrait ? .4 : .36))));
  touchEl.style.setProperty('--dp', dp + 'px');
  touchEl.style.setProperty('--bt', Math.round(dp * .5) + 'px');
  tbar.style.top = Math.round(top + 12 * s + 4) + 'px';          // subito sotto la barra dei punti
  tbar.style.right = Math.max(6, Math.round((W - w) / 2 + 6)) + 'px';
  const p = Math.max(2, s);
  crt.style.backgroundImage =
    `repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0px,rgba(0,0,0,0) ${p - 1}px,rgba(0,0,0,.22) ${p - 1}px,rgba(0,0,0,.22) ${p}px)`;
}
function showTouch() { if (touchUI) return; touchUI = true; touchEl.classList.add('on'); resize(); }
if (matchMedia('(pointer: coarse)').matches) { touchUI = true; touchEl.classList.add('on'); }
addEventListener('touchstart', showTouch, { passive: true });
addEventListener('resize', resize); resize();

// RNG con seme (per grafica deterministica)
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(1174);

// ====================================================================
//  FONT BITMAP 3x5
// ====================================================================
const FONT = {
  A:[7,5,7,5,5],B:[6,5,6,5,6],C:[7,4,4,4,7],D:[6,5,5,5,6],E:[7,4,6,4,7],F:[7,4,6,4,4],G:[7,4,5,5,7],
  H:[5,5,7,5,5],I:[7,2,2,2,7],J:[1,1,1,5,7],K:[5,5,6,5,5],L:[4,4,4,4,7],M:[5,7,7,5,5],N:[6,5,5,5,5],
  O:[7,5,5,5,7],P:[7,5,7,4,4],Q:[7,5,5,7,1],R:[7,5,6,5,5],S:[7,4,7,1,7],T:[7,2,2,2,2],U:[5,5,5,5,7],
  V:[5,5,5,5,2],W:[5,5,7,7,5],X:[5,5,2,5,5],Y:[5,5,7,2,2],Z:[7,1,2,4,7],
  0:[7,5,5,5,7],1:[2,6,2,2,7],2:[7,1,7,4,7],3:[7,1,7,1,7],4:[5,5,7,1,1],5:[7,4,7,1,7],6:[7,4,7,5,7],
  7:[7,1,1,1,1],8:[7,5,7,5,7],9:[7,5,7,1,7],
  ':':[0,2,0,2,0],'!':[2,2,2,0,2],'.':[0,0,0,0,2],'-':[0,0,7,0,0],"'":[2,2,0,0,0],',':[0,0,0,2,4],
  '/':[1,1,2,4,4],'+':[0,2,7,2,0],'?':[7,1,3,0,2],'<':[1,2,4,2,1],'>':[4,2,1,2,4]
};
function rawText(str, x, y, col, s) {
  ctx.fillStyle = col; let cx = x;
  for (const ch of str) {
    const g = FONT[ch];
    if (g) for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) if (g[r] & (4 >> c)) ctx.fillRect(cx + c * s, y + r * s, s, s);
    cx += 4 * s;
  }
}
function text(str, x, y, col = '#fff', s = 1, sh = '#1b1424') {
  str = String(str).toUpperCase();
  if (sh) rawText(str, x + s, y + s, sh, s);
  rawText(str, x, y, col, s);
}
const textW = (str, s = 1) => String(str).length * 4 * s - s;
const ctext = (str, y, col, s = 1) => text(str, Math.round((VW - textW(str, s)) / 2), y, col, s);
const pad = (n, w) => String(Math.max(0, n)).padStart(w, '0');

// ====================================================================
//  AUDIO (chiptune WebAudio)
// ====================================================================
let AC = null, master = null, musicOn = true;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .3; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(f, d, type = 'square', vol = .2, slide = 0, when = 0) {
  if (!AC) return;
  const t = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .02);
}
const seq = (notes, dur, gap, type = 'square', vol = .15) => notes.forEach((f, i) => f && tone(f, dur, type, vol, 0, i * gap));
const SFX = {
  jump:  () => tone(260, .18, 'square', .13, 520),
  coin:  () => { tone(988, .06, 'square', .13); tone(1319, .25, 'square', .13, 0, .06); },
  stomp: () => tone(260, .12, 'square', .2, -200),
  bump:  () => tone(110, .1, 'triangle', .45, -40),
  die:   () => seq([523, 494, 466, 440, 415, 392, 370], .13, .11),
  life:  () => seq([523, 659, 784, 1047, 784, 1047], .1, .08),
  win:   () => seq([523, 659, 784, 1047, 0, 784, 1047, 1319], .14, .12),
  tick:  () => tone(1600, .03, 'square', .05),
  over:  () => seq([392, 370, 349, 330], .35, .3, 'triangle', .3),
  pause: () => { tone(660, .05, 'square', .1); tone(880, .08, 'square', .1, 0, .06); }
};
// Launeddas: tumbu (bordone) + mancosa + mancosedda, in Sol misolidio
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const MA = [74,71,72,74,76,74,72,71], MB = [74,71,72,74,72,71,69,71],
      MC = [79,76,77,79,76,74,72,74], MD = [71,72,74,72,71,69,67,67];
const MEL = [...MA, ...MB, ...MA, ...MB, ...MC, ...MC, ...MA, ...MD];
const STEP_T = .115;
let mStep = 0, mNext = 0;
function reed(f, d, vol, when, type = 'square') {
  if (!AC) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01);
  g.gain.setValueAtTime(vol, t + d * .8); g.gain.linearRampToValueAtTime(0, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .02);
}
function musicTick() {
  if (!AC || !musicOn || state !== 'play' || P.dead) { mNext = 0; return; }
  const now = AC.currentTime;
  if (mNext < now) mNext = now + .05;
  while (mNext < now + .2) {
    const i = mStep % MEL.length, w = mNext - now;
    reed(mtof(MEL[i]), STEP_T * .95, .045, w);                                   // mancosedda (melodia)
    if (i % 2 === 0) reed(mtof(i % 8 < 4 ? 67 : 71), STEP_T * 1.9, .025, w);     // mancosa
    if (i % 16 === 0) reed(mtof(43), STEP_T * 16, .05, w, 'sawtooth');          // tumbu (bordone)
    if (i % 4 === 0) tone(110, .09, 'triangle', .22, -50, w);                   // battito del ballo tundu
    mStep++; mNext += STEP_T;
  }
}

// ====================================================================
//  GRAFICA: SPRITE E TILE
// ====================================================================
function mk(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); fn(g); return c; }
function flipH(img) { return mk(img.width, img.height, g => { g.translate(img.width, 0); g.scale(-1, 1); g.drawImage(img, 0, 0); }); }
const PAL = {
  K:'#1b1424', R:'#d4382c', r:'#8a1e22', S:'#f2b98a', H:'#5a2e1a', W:'#f4ecd8', B:'#2f56b0', b:'#1c3270',
  G:'#5cb03c', g:'#2e6a26', Y:'#f0c040', y:'#a8701c', O:'#e87818', L:'#98a0b8',
  V:'#dcff3a', J:'#ffe03c', n:'#8a5a34', u:'#d4a66c', P:'#ffb0c8', p:'#d8708e', m:'#2a1a14', k:'#24202c', z:'#6a6478', q:'#c87ae0', Q:'#7a3a9a', c:'#3a8ef0', e:'#1e9a8a'
};
function sprite(rows) {
  return mk(rows[0].length, rows.length, g => rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch !== '.') { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); }
  })));
}
const pTop = ["...RRRR...","..RRRRRRR.","..HSSSKS..","..HSSSSSS.","...SSSS...","..WWWWWW..",
              ".SWBWWBWS.",".SWBBBBWS.","...BBBB...","...BBBB..."];
const SPR = {};
SPR.stand = sprite([...pTop, "...BB.BB..", "...BB.BB..", "..KKK.KKK."]);
SPR.walk1 = sprite([...pTop, "..BB...BB.", ".BB.....BB", ".KK.....KK"]);
SPR.walk2 = sprite([...pTop, "....BBB...", "....BB....", "....KKK..."]);
SPR.jump  = sprite(["S..RRRR..S","S.RRRRRRRS","S.HSSSKS.S","SSHSSSSSSS","...SSSS...","..WWWWWW..",
                    "..WBWWBW..","..WBBBBW..","...BBBB...","...BBBB...","..BB..BB..","..BB...BB.",".KKK...KK."]);
for (const k of Object.keys(SPR)) SPR[k + 'L'] = flipH(SPR[k]);
// --- nemici sardi: colori leggibili anche per i daltonici (niente verde), contorno nero + alone bianco ---
// sa Merdona (la nutria): pelo marrone, pancia chiara, dentoni arancioni, coda da topo
const merTop = ["..nn............", ".nnnnnnnnnn.....", "nKnnnnnnnnnnn...", "nnnnnnnnnnnnnn..", "nnnuuuuuuuunnnz.", ".OOuuuuuuuuunn.z"];
SPR.mer1 = sprite([...merTop, "...nn...nn.....z", "...kk....kk....."]);
SPR.mer2 = sprite([...merTop, "..nn....nn.....z", "..kk.....kk....."]);
// su Mamuthone di Mamoiada: maschera scura, muccadore arancio, pelli nere e campanacci d'ottone
const mamTop = ["...HHHHHH...", "..HHHHHHHH..", "..mmmmmmmm..", "..mLLmmLLm..", "..mmmmmmmm..", "..mmmmmmmm..",
                "...mmmmmm...", "..OOOOOOOO..", ".kkkkkkkkkk.", "kkzkkzkkzkkk"];
SPR.mam1 = sprite([...mamTop, "kJJkJJkJJkJk", "kJJkJJkJJkk.", ".kkzkkkzkkk.", "..kk....kk..", "..KK....KK..", ".KKK...KKK.."]);
SPR.mam2 = sprite([...mamTop, "JkJJkJJkJJkk", ".kJJkJJkJJkk", ".kkzkkkzkkk.", "...kk..kk...", "...KK..KK...", "..KKK.KKK..."]);
// su porcheddu: rosa chiaro, ti carica quando ti vede
const porTop = ["...pp.........", "..pPPp........", ".PPPPPPPPPPP..", "PPKPPPPPPPPPP.", "pPPPPPPPPPPPPp", "pPPPPPPPPPPPp.", ".PPPPPPPPPPPP."];
SPR.por1 = sprite([...porTop, "..pP...Pp.Pp..", "..H....H..H..."]);
SPR.por2 = sprite([...porTop, "...pP.Pp...pP.", "...H..H.....H."]);
SPR.gull1 = sprite(["..W.....W...","..WW...WW...","...WWWWW....","OKWWWWWWWL..","..WWWWWL....","....LL......"]);
SPR.gull2 = sprite(["............","............","...WWWWW....","OKWWWWWWWL..","..WWWWWL....",".WW.LL..WW.."]);
// contorno: nero attaccato al corpo, poi alone bianco -> si stacca da qualunque sfondo
function outlined(img) {
  const iw = img.width, ih = img.height, a = img.getContext('2d').getImageData(0, 0, iw, ih).data;
  const on = (x, y) => x >= 0 && y >= 0 && x < iw && y < ih && a[(y * iw + x) * 4 + 3] > 0;
  return mk(iw + 4, ih + 4, g => {
    for (let y = -2; y < ih + 2; y++) for (let x = -2; x < iw + 2; x++) {
      if (on(x, y)) continue;
      let n1 = false, n2 = false;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (on(x + dx, y + dy)) {
        if (Math.abs(dx) <= 1 && Math.abs(dy) <= 1) n1 = true; else n2 = true; }
      if (n1 || n2) { g.fillStyle = n1 ? '#000000' : '#ffffff'; g.fillRect(x + 2, y + 2, 1, 1); }
    }
    g.drawImage(img, 2, 2);
  });
}
// su parcheggiatore abusivo del Poetto: cappellino, baffi, gilet giallo fluo con bande riflettenti, fa segno col braccio
const parkHead = ["....bbbb....", "...bbbbbb...", "..bbbbbbbb.."];
SPR.park1 = sprite([...parkHead, "...SSSSSS...", "...SKSSKS...", "...SSSSSS...", "....SHHS....", "..VVVVVVVV..",
  ".SVVLLLLVVS.", ".SVVVVVVVVS.", ".SVLLLLLLVS.", "..VVVVVVVV..", "..BBBBBBBB..", "..BB....BB..", "..BB....BB..", ".KKK....KKK."]);
SPR.park2 = sprite([...parkHead, "...SSSSSS..S", "...SKSSKS..S", "...SSSSSS.S.", "....SHHS..S.", "..VVVVVVVVS.",
  ".SVVLLLLVV..", ".SVVVVVVVV..", ".SVLLLLLLV..", "..VVVVVVVV..", "..BBBBBBBB..", "...BB..BB...", "...BB..BB...", "..KKK.KKK..."]);
// su granchio: arancione acceso, chele che si aprono, cammina di lato
SPR.gra1 = sprite([".OO........OO.", "OOOO.W..W.OOOO", ".OO..K..K..OO.", "..O.OOOOOO.O..", "...OOOOOOOO...",
                   "..OOOOOOOOOO..", ".O.rOOOOOOr.O.", "O..r.r..r.r..O"]);
SPR.gra2 = sprite(["OO..........OO", "OOO..W..W..OOO", ".OO..K..K..OO.", "..O.OOOOOO.O..", "...OOOOOOOO...",
                   "..OOOOOOOOOO..", "..OrOOOOOOrO..", ".O.r.r..r.r.O."]);
// su polpo: viola chiaro con le ventose scure, salta fuori dai banchi
const polTop = ["...qqqqqq...", "..qqqqqqqq..", ".qqqqqqqqqq.", ".qWKqqqqWKq.", ".qqqqqqqqqq.", ".qqQqqqqQqq.", "..qqqqqqqq.."];
SPR.pol1 = sprite([...polTop, ".qQq.qq.qQq.", "q..q.qq.q..q", "q.q..q.q..q."]);
SPR.pol2 = sprite([...polTop, "qQ.q.qq.q.Qq", ".q.q.qq.q.q.", "..q.q..q.q.."]);
// su pavone di Monte Urpinu: blu acceso, coda verde-azzurra con gli occhi d'oro; se ti avvicini fa la ruota
const pavTop = [".c..................", "ccc.................", "OcKc................", "..cc................", "..cc................",
                "..ccc...............", "..cccceeeeeeeeee....", "..ccccceeYeeeYeeeee.", "...cccceeeeeeeeeeee.", "....cc..eeeeeeee...."];
SPR.pav1 = sprite([...pavTop, "....H...H...........", "...HH..HH..........."]);
SPR.pav2 = sprite([...pavTop, ".....H.H............", "....HH.HH..........."]);
SPR.pavFan = mk(19, 17, g => {
  for (let y = 0; y < 17; y++) for (let x = 0; x < 19; x++) {
    const dx = x - 9, dy = y - 15, d = Math.hypot(dx, dy);

const tileAt = (tx, ty) => (tx < 0 || tx >= LW) ? '#' : (ty < 0 || ty >= LH) ? '.' : map[ty][tx];
const solidAt = (x, y) => SOLID.has(tileAt(Math.floor(x / T), Math.floor(y / T)));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function collideX(e) {
  const y0 = Math.floor(e.y / T), y1 = Math.floor((e.y + e.h - .01) / T);
  if (e.vx > 0) { const tx = Math.floor((e.x + e.w - .01) / T);
    for (let ty = y0; ty <= y1; ty++) if (SOLID.has(tileAt(tx, ty))) { e.x = tx * T - e.w; return true; } }
  else if (e.vx < 0) { const tx = Math.floor(e.x / T);
    for (let ty = y0; ty <= y1; ty++) if (SOLID.has(tileAt(tx, ty))) { e.x = (tx + 1) * T; return true; } }
  return false;
}
function collideY(e) {
  const x0 = Math.floor(e.x / T), x1 = Math.floor((e.x + e.w - .01) / T);
  if (e.vy > 0) { const ty = Math.floor((e.y + e.h - .01) / T);
    for (let tx = x0; tx <= x1; tx++) if (SOLID.has(tileAt(tx, ty))) { e.y = ty * T - e.h; return 1; } }
  else if (e.vy < 0) { const ty = Math.floor(e.y / T); let best = null, bd = 1e9;
    for (let tx = x0; tx <= x1; tx++) if (SOLID.has(tileAt(tx, ty))) {
      const d = Math.abs(tx * T + 8 - (e.x + e.w / 2)); if (d < bd) { bd = d; best = { tx, ty }; } }
    if (best) { e.y = (best.ty + 1) * T; return best; } }
  return 0;
}

  touchEl.querySelectorAll('.btn').forEach(b => b.classList.toggle('on', !!held[b.dataset.k]));
  syncK();

touchEl.addEventListener('pointerdown', e => {
  const c = e.target.closest('.btn, #dpad, [data-a]'); if (!c) return;

buildLevel();
